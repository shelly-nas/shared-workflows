# Reusable Build & Push Workflow

name: Build & push Docker image


on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry URL'
        required: true
        type: string
      image_tag:
        description: 'Full image tag (registry/image:tag)'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string
      runner:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'shelly'
    secrets:
      registry_password:
        description: 'Registry password'
        required: true

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ${{ inputs.runner }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Registry
        run: |
          echo "${{ secrets.registry_password }}" | docker login ${{ inputs.registry }} \
            --username "${{ vars.REGISTRY_USERNAME }}" \
            --password-stdin
      
      - name: Clean up old images
        run: |
          docker image prune -af || true
      
      # image_tag may hold several references separated by commas (a version
      # and latest); docker build takes one --tag per reference.
      - name: Build Docker image
        working-directory: ${{ inputs.context }}
        env:
          IMAGE_TAGS: ${{ inputs.image_tag }}
        run: |
          args=()
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            args+=(--tag "$(echo "$tag" | xargs)")
          done
          docker build "${args[@]}" --file Dockerfile .

      - name: Push Docker image
        env:
          IMAGE_TAGS: ${{ inputs.image_tag }}
        run: |
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker push "$(echo "$tag" | xargs)"
          done

      - name: Remove local image
        if: always()
        env:
          IMAGE_TAGS: ${{ inputs.image_tag }}
        run: |
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker image rm -f "$(echo "$tag" | xargs)" || true
          done
      
      - name: Log out from Registry
        if: always()
        run: docker logout ${{ inputs.registry }}
